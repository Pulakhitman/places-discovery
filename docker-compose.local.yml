# Local Docker without Traefik — publish port 3001 on the host.
# Usage:
#   cp .env.example .env
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
services:
  places-discovery:
    ports:
      - "3001:3000"
    networks:
      - default
    labels:
      - traefik.enable=false

networks:
  traefik:
    # Override external Traefik network so local compose does not require it.
    external: false
    name: places-discovery-local-traefik-unused
