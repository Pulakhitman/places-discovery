services:
  places-discovery:
    build: .
    container_name: places-discovery
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    # Optional Overture SQLite snapshot, generated outside the web container.
    # Mount read-only so neither search nor exports can mutate an imported release.
    volumes:
      - ${OVERTURE_DATA_DIR:-./data/overture}:/data/overture:ro
    # Traefik / reverse-proxy friendly: expose only — do not publish host ports
    expose:
      - "3000"
    networks:
      - default
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
      - traefik.http.routers.places-discovery.rule=Host(`${DOMAIN:-places.localhost}`)
      - traefik.http.routers.places-discovery.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.places-discovery.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.places-discovery.loadbalancer.server.port=3000
      - traefik.http.routers.places-discovery.middlewares=places-discovery-headers
      - traefik.http.middlewares.places-discovery-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.places-discovery-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.places-discovery-headers.headers.browserXssFilter=true
      - traefik.http.middlewares.places-discovery-headers.headers.referrerPolicy=strict-origin-when-cross-origin
      - traefik.http.middlewares.places-discovery-headers.headers.customFrameOptionsValue=SAMEORIGIN
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:3000/api/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
